name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned 2026-08-30
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - run: cargo install lenso-contract-codegen --version 0.7.4 --locked
      - run: bun run --filter '@lenso/bun' capabilities:check
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test:typescript
      - run: bun run package-smoke
      - run: npm pack --dry-run ./packages/lenso-bun
      - run: npm pack --dry-run ./packages/lenso-bun-plugin
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Build Bun fixtures
        run: |
          bun build --target bun fixtures/bun/sdk-request-provider.ts --outdir /tmp/lenso-bun-fixtures
          bun build --target bun fixtures/bun/request-provider.ts --outdir /tmp/lenso-bun-fixtures
          bun build --target bun fixtures/bun/request-consumer.ts --outdir /tmp/lenso-bun-fixtures
      - name: Run wire benchmark smoke
        env:
          LENSO_BUN_BENCHMARK_REQUESTS: 5
        run: |
          bun fixtures/bun/wire-benchmark.ts --output /tmp/lenso-bun-wire-smoke.json
          bun -e 'const value = await Bun.file("/tmp/lenso-bun-wire-smoke.json").json(); if (value.schema !== "lenso.bun-wire-benchmark.v1" || value.candidates?.["json-rpc-http"]?.request_count !== 5) process.exit(1)'
      - name: Run cross-runtime conformance
        run: cargo test --locked -p lenso-bun-adapter --test bun_cross_runtime -- --ignored --test-threads=1

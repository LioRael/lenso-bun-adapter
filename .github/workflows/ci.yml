name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - run: cargo install --git https://github.com/LioRael/lenso-protocols --rev 9769bc5dc828fd9111da6d28a4ecd5f1bb198ab4 lenso-contract-codegen --locked
      - run: bun run --filter '@lenso/bun' capabilities:check
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test:typescript
      - run: bun run package-smoke
      - run: npm pack --dry-run ./packages/lenso-bun
      - run: npm pack --dry-run ./packages/lenso-bun-plugin
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo test --locked --workspace
      - name: Build Bun fixtures
        run: |
          bun build --target bun fixtures/bun/sdk-request-provider.ts --outdir /tmp/lenso-bun-fixtures
          bun build --target bun fixtures/bun/request-provider.ts --outdir /tmp/lenso-bun-fixtures
          bun build --target bun fixtures/bun/request-consumer.ts --outdir /tmp/lenso-bun-fixtures
          bun build --target bun fixtures/bun/wire-benchmark.ts --outdir /tmp/lenso-bun-fixtures
      - name: Run cross-runtime conformance
        run: cargo test --locked -p lenso-bun-adapter --test bun_cross_runtime -- --ignored --test-threads=1

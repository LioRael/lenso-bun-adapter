name: Release npm package

on:
  push:
    tags:
      - "lenso-bun-module-ts-v*"

permissions: {}

jobs:
  publish:
    name: Publish @lenso/bun-module
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify release tag
        run: |
          package_version="$(node -p "require('./packages/lenso-bun-module/package.json').version")"
          test "$GITHUB_REF_NAME" = "lenso-bun-module-ts-v${package_version}"
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Verify package
        run: |
          bun run build
          bun run typecheck
          bun run test:typescript
          bun run package-smoke
          npm pack --dry-run ./packages/lenso-bun-module
      - name: Publish package
        run: npm publish ./packages/lenso-bun-module --access public --provenance

name: Release npm package

on:
  push:
    tags:
      - "lenso-bun-plugin-ts-v*"

permissions: {}

jobs:
  publish:
    name: Publish @lenso/bun-plugin
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Verify release tag
        run: |
          package_version="$(node -p "require('./packages/lenso-bun-plugin/package.json').version")"
          test "$GITHUB_REF_NAME" = "lenso-bun-plugin-ts-v${package_version}"
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Verify package
        run: |
          bun run build
          bun run typecheck
          bun run test:typescript
          bun run package-smoke
          npm pack --dry-run ./packages/lenso-bun-plugin
      - name: Publish package
        run: npm publish ./packages/lenso-bun-plugin --access public --provenance

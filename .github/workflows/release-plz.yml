name: Release-plz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release-pr:
    name: Release-plz PR
    if: ${{ github.repository_owner == 'LioRael' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned 2026-08-30
        with:
          toolchain: 1.94.0
      - name: Create release PR
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
          config: .github/release-plz.toml

  release:
    name: Release-plz release
    if: ${{ github.repository_owner == 'LioRael' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned 2026-08-30
        with:
          toolchain: 1.94.0
      - name: Release published packages
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
          config: .github/release-plz.toml

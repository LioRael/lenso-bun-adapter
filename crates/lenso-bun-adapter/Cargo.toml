[package]
name = "lenso-bun-adapter"
version = "0.1.8"
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
description = "Bun process Execution Adapter for Lenso vNext."

[features]
process-test-fixture = ["dep:lenso-process-sdk"]

[dependencies]
axum.workspace = true
base64.workspace = true
futures.workspace = true
getrandom.workspace = true
hmac.workspace = true
hex.workspace = true
jsonrpsee = { version = "0.26", default-features = false, features = ["http-client", "server"] }
lenso-app-plan = { version = "0.4.1" }
lenso-kernel = { version = "0.3.3" }
lenso-process-protocol = { version = "0.2.1" }
lenso-runtime-codec = { version = "0.3.1" }
lenso-process-sdk = { version = "0.1.1", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tiny_http = "0.12"
tokio.workspace = true

[dev-dependencies]
lenso-native-adapter = { version = "0.3.3" }
lenso-process-adapter = { version = "0.2.0" }
tempfile = "3"
time.workspace = true

[[bin]]
name = "lenso-bun-rust-process-fixture"
path = "src/bin/rust_process_fixture.rs"
required-features = ["process-test-fixture"]
test = false

[lints]
workspace = true

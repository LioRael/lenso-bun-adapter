[package]
name = "lenso-bun-adapter"
version = "0.1.5"
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
description = "Bun process Execution Adapter for Lenso vNext."

[features]
process-test-fixture = ["dep:lenso-process-sdk"]

[dependencies]
futures.workspace = true
jsonrpsee = { version = "0.26", default-features = false, features = ["http-client", "server"] }
lenso-app-plan = { version = "0.4.1" }
lenso-kernel = { version = "0.3.2" }
lenso-runtime-codec = { version = "0.3.0" }
lenso-process-sdk = { version = "0.1.0", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tiny_http = "0.12"
tokio.workspace = true

[dev-dependencies]
hex = "0.4"
lenso-native-adapter = { version = "0.3.2" }
lenso-process-adapter = { version = "0.1.1" }
tempfile = "3"
time.workspace = true

[[bin]]
name = "lenso-bun-rust-process-fixture"
path = "src/bin/rust_process_fixture.rs"
required-features = ["process-test-fixture"]
test = false

[lints]
workspace = true

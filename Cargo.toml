[workspace]
resolver = "2"
members = ["crates/lenso-bun-adapter"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/LioRael/lenso-bun-adapter"
rust-version = "1.94"

[workspace.dependencies]
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.52", features = ["io-util", "macros", "net", "rt", "signal", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[patch."https://github.com/LioRael/lenso"]
lenso-app-plan = "0.1.0"
lenso-auth-sdk = "0.1.1"
lenso-capability-auth = "0.1.1"
lenso-contract-codegen = "0.1.0"
lenso-kernel = "0.1.1"
lenso-native-adapter = "0.1.1"
